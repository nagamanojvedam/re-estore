services:
  backend:
    build: ./backend
    container_name: re-estore-backend

    ports:
      - "3000:3000"

    env_file:
      - ./backend/mbm.env

    restart: always

  frontend:
    build:
      context: ./frontend
      secrets:
        - env
    container_name: re-estore-frontend

    ports:
      - "5173:80"

    depends_on:
      - backend

    restart: always

secrets:
  env:
    file: ./frontend/.env
