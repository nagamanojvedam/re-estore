name: re-estore - dev

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Backup current images
        run: |
          echo "Creating backup images..."

          docker tag re-estore-backend:current re-estore-backend:backup || true
          docker tag re-estore-frontend:current re-estore-frontend:backup || true
      
      - name: Build new images
        run : |
          echo "Building new images..."

          IMAGE_TAG=new docker compose build
      
      - name: Stop existing containers
        run: |
          echo "Stopping old containers..."

          docker stop \
            re-estore-backend \
            re-estore-frontend || true
          
          docker rm \
            re-estore-backend \
            re-estore-frontend || true
      
      - name: Start new containers
        run: |
          echo "Starting new containers..."

          IMAGE_TAG=new docker compose up -d
      
      - name: Health checks
        run: |
          echo "Waiting for containers..."
          sleep 5

          echo "Checking backend..."
          curl --fail http://localhost:3000/health

          echo "Checking frontend..."
          curl --fail http://localhost:8080

          echo "Deployment successful ;)"
      
      - name: Promote new images
        if: success()
        run: |
          echo "Promoting new images..."

          docker tag re-estore-backend:new re-estore-backend:current
          docker tag re-estore-frontend:new re-estore-frontend:current

          docker rmi re-estore-backend:new || true
          docker rmi re-estore-frontend:new || true

      - name: Rollback
        if: failure()
        run: |
          echo "Deployment failed. Rolling back..."

          docker stop \
            re-estore-backend \
            re-estore-frontend || true

          docker rm \
            re-estore-backend \
            re-estore-frontend || true

          echo "Starting backup version..."

          IMAGE_TAG=backup docker compose up -d
      
      - name: Cleanup unused images
        if: success()
        run: |
          docker image prune -f